[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fdp-shared"
version = "0.1.0"
description = "Shared models and utilities for Fraud Detection Platform"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["shared*"]
